<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Import Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; display: flex; align-items: center; min-height: 100vh; }
    .login-card { max-width: 400px; width: 100%; }
    .brand { color: #009639; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center">
    <div class="card login-card shadow">
      <div class="card-body p-4">
        <h3 class="brand mb-1">Import Tracker</h3>
        <p class="text-muted mb-3">Admin access — configure threshold profiles</p>
        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="POST">
          <div class="mb-3">
            <label for="token" class="form-label">Admin Token</label>
            <input type="password" class="form-control" id="token" name="token" required autofocus>
          </div>
          <button type="submit" class="btn btn-success w-100">Sign In</button>
        </form>
        <p class="mt-3 text-muted small">
          <a href="{{ url_for('index') }}">Back to main site</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
